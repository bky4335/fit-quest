<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIT QUEST</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--sub:#667085;--pri:#5b5bf0;--ok:#16a34a;--bd:#e4e7ee;--xp:#f59e0b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c1f2b;--tx:#eef0f6;--sub:#9aa3b5;--pri:#8b8bff;--bd:#2c3040;--ok:#4ade80;--xp:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c1f2b;--tx:#eef0f6;--sub:#9aa3b5;--pri:#8b8bff;--bd:#2c3040;--ok:#4ade80;--xp:#fbbf24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.sub{color:var(--sub);font-size:14px}
label{display:block;font-size:14px;margin:10px 0 4px;font-weight:600}
input[type=number],input[type=text],select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{padding:8px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
button.b{width:100%;padding:14px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px}
button.g{background:transparent;color:var(--sub);border:1px solid var(--bd)}
.top{display:flex;justify-content:space-between;align-items:center}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--xp);width:0;transition:width .4s}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
.q{display:flex;gap:12px;align-items:flex-start}
.q.done{opacity:.55}
.q input{width:24px;height:24px;margin-top:4px;accent-color:var(--ok)}
.q b{display:block}
.tag{font-size:12px;color:var(--pri);font-weight:700}
.sm{font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--sub);cursor:pointer;margin-top:6px}
a.lk{font-size:14px;color:var(--pri);font-weight:700;text-decoration:none}
.hide{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.s{opacity:1}
</style>
</head>
<body>
<div class="w">
 <div class="top"><h1>🏆 FIT QUEST</h1><span class="sub" id="lv"></span></div>
 <div class="bar"><i id="xpb"></i></div>

 <section id="s1">
  <div class="card">
   <h2>① 내 몸 알려주기</h2>
   <p class="sub">입력한 정보는 이 기기에서만 사용돼요.</p>
   <div class="row"><div><label>키 (cm)</label><input type="number" id="h" value="170"></div><div><label>몸무게 (kg)</label><input type="number" id="wt" value="65"></div></div>
   <label>체형</label>
   <div class="chips" id="body"><span class="chip" data-v="slim">마른 편</span><span class="chip on" data-v="normal">보통</span><span class="chip" data-v="chubby">통통한 편</span></div>
   <label>운동 목표</label>
   <div class="chips" id="goal"><span class="chip on" data-v="start">운동 습관 만들기</span><span class="chip" data-v="muscle">근력 키우기</span><span class="chip" data-v="diet">체지방 줄이기</span></div>
   <div class="row"><div><label>운동 경험</label><select id="lvl"><option value="0">처음이에요</option><option value="1">가끔 해요</option><option value="2">꾸준히 해요</option></select></div>
   <div><label>하루 시간</label><select id="min"><option value="10">10분</option><option value="15" selected>15분</option><option value="20">20분</option></select></div></div>
   <label>운동 성향 (3문항)</label>
   <select class="pq"><option value="0">운동할 땐 혼자 집중하는 게 편해요</option><option value="0.5">상황에 따라 달라요</option><option value="1">사람들과 함께 하는 게 편해요</option></select>
   <select class="pq" style="margin-top:8px"><option value="0">의지가 약해질 땐 나만의 기록·퀘스트가 도움돼요</option><option value="0.5">둘 다 도움돼요</option><option value="1">같이 하는 사람의 응원이 도움돼요</option></select>
   <select class="pq" style="margin-top:8px"><option value="0">조용하고 개인 운동하기 좋은 곳이 끌려요</option><option value="0.5">잘 모르겠어요</option><option value="1">그룹 수업이나 모임이 있는 곳이 끌려요</option></select>
   <button class="b" onclick="go(2)">다음: 우리 집 운동 기구 →</button>
  </div>
 </section>

 <section id="s2" class="hide">
  <div class="card">
   <h2>② 집에 있는 물건 알려주기</h2>
   <p class="sub">의자, 아령, 계단 등을 사진으로 올리고 아래에서 사용할 수 있는 물건을 골라 주세요.</p>
   <input type="file" id="ph" accept="image/*" multiple>
   <div class="thumbs" id="th"></div>
   <p class="sub" id="note" style="margin-top:8px">사진은 업로드 미리보기로만 쓰여요. 자동 기구 인식은 AI 연결 후 지원돼요.</p>
   <label>사용 가능한 물건</label>
   <div class="chips" id="eq">
    <span class="chip" data-v="chair">🪑 의자</span><span class="chip" data-v="dumbbell">🏋️ 아령</span><span class="chip" data-v="bottle">🧴 물병</span>
    <span class="chip" data-v="band">➰ 밴드</span><span class="chip" data-v="stairs">🪜 계단</span><span class="chip" data-v="wall">🧱 벽</span><span class="chip" data-v="mat">🧘 매트</span>
   </div>
   <p class="sub">아무것도 없어도 괜찮아요. 맨몸 운동으로 시작해요!</p>
   <button class="b" onclick="build()">내 퀘스트 만들기 ⚔️</button>
   <button class="b g" onclick="go(1)">← 이전</button>
  </div>
 </section>

 <section id="s3" class="hide">
  <div class="card"><h2 id="sum"></h2><p class="sub" id="sum2"></p></div>
  <div class="card" id="place"></div>
  <div id="qs"></div>
  <div class="card" id="fin" style="text-align:center"></div>
  <button class="b g" onclick="go(1)">몸 정보·기구 다시 설정</button>
 </section>
</div>
<div class="toast" id="t"></div>

<script>
/* 배포 전에 아래 3개 값을 채워 주세요. (anon key와 지도 Client ID는 공개되어도 되는 값이에요. service role key, 카카오 키는 절대 넣지 마세요.) */
var CFG={SUPABASE_URL:'https://oyuemimooaicuipjkcos.supabase.co',ANON_KEY:'sb_publishable_RzcKDgxTUsIlHW55bHLSjg_Ge956ScD',NAVER_MAP_CLIENT_ID:''};
if(CFG.NAVER_MAP_CLIENT_ID){var ms=document.createElement('script');ms.src='https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId='+encodeURIComponent(CFG.NAVER_MAP_CLIENT_ID);document.head.appendChild(ms)}
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var S={body:'normal',goal:'start',eq:[],xp:0,streak:0,quests:[]};
try{var sv=JSON.parse(localStorage.getItem('fq')||'null');if(sv){S.xp=sv.xp||0;S.streak=sv.streak||0}}catch(e){}
var EX=[
{n:'스쿼트',q:'none',p:'하체',r:12,g:'발은 어깨너비, 엉덩이를 뒤로 빼며 앉고 무릎이 발끝을 넘지 않게 해요.',e:'의자에 앉았다 일어나기'},
{n:'푸시업',q:'none',p:'가슴·팔',r:10,g:'머리부터 발끝까지 일자로 유지하고 가슴이 바닥 가까이 가게 내려가요.',e:'벽 짚고 푸시업'},
{n:'플랭크',q:'none',p:'코어',s:30,g:'팔꿈치를 어깨 아래에 두고 허리가 처지지 않게 버텨요.',e:'무릎 대고 플랭크'},
{n:'글루트 브릿지',q:'none',p:'엉덩이',r:12,g:'누워서 무릎을 세우고 엉덩이를 천천히 들어 올려요.',e:'엉덩이 들고 3초만 버티기'},
{n:'제자리 버피',q:'none',p:'전신',r:8,cardio:1,hi:1,g:'앉았다가 일어나며 가볍게 점프해요.',e:'점프 없이 천천히 걷듯이'},
{n:'마운틴 클라이머',q:'none',p:'전신',s:20,cardio:1,hi:1,g:'플랭크 자세로 무릎을 번갈아 가슴 쪽으로 당겨요.',e:'천천히 한 발씩'},
{n:'의자 딥스',q:'chair',p:'팔',r:10,g:'의자 끝을 잡고 팔꿈치를 90도로 구부렸다 펴요.',e:'발을 의자 가까이 두기'},
{n:'의자 스텝업',q:'chair',p:'하체',r:10,cardio:1,g:'튼튼한 의자 위로 한 발씩 올라섰다 내려와요.',e:'낮은 계단이나 책 한 권 높이로'},
{n:'의자 푸시업',q:'chair',p:'가슴',r:10,g:'의자를 짚고 몸을 일자로 만든 뒤 가슴을 의자 쪽으로 내려요.',e:'벽 푸시업으로 바꾸기'},
{n:'덤벨 로우',q:'dumbbell',p:'등',r:12,g:'상체를 숙이고 팔꿈치를 뒤로 당겨 날개뼈를 모아요.',e:'가벼운 무게로 천천히'},
{n:'덤벨 숄더프레스',q:'dumbbell',p:'어깨',r:10,g:'귀 옆에서 머리 위로 밀어 올려요. 허리는 꺾지 않아요.',e:'앉아서 하기'},
{n:'물병 로우',q:'bottle',p:'등',r:12,g:'물병을 들고 상체를 숙여 팔꿈치를 뒤로 당겨요.',e:'가벼운 병으로 바꾸기'},
{n:'물병 숄더프레스',q:'bottle',p:'어깨',r:10,g:'물병을 어깨 높이에서 머리 위로 밀어 올려요.',e:'앉아서 하기'},
{n:'밴드 로우',q:'band',p:'등',r:12,g:'밴드를 당기며 날개뼈를 모아 줘요.',e:'밴드를 느슨하게 잡기'},
{n:'계단 오르내리기',q:'stairs',p:'유산소',s:60,cardio:1,g:'난간을 잡고 일정한 속도로 오르내려요.',e:'한 칸씩 천천히 걷기'},
{n:'벽 스쿼트',q:'wall',p:'하체',s:30,g:'등을 벽에 붙이고 의자에 앉은 자세로 버텨요.',e:'각도를 높여서 버티기'}
];
function $(i){return document.getElementById(i)}
function go(n){for(var i=1;i<=3;i++)$('s'+i).classList.toggle('hide',i!==n);window.scrollTo(0,0)}
function toast(m){var t=$('t');t.textContent=m;t.classList.add('s');setTimeout(function(){t.classList.remove('s')},1800)}
['body','goal'].forEach(function(id){$(id).onclick=function(e){var c=e.target.closest('.chip');if(!c)return;[].forEach.call($(id).children,function(x){x.classList.remove('on')});c.classList.add('on');S[id]=c.dataset.v}});
$('eq').onclick=function(e){var c=e.target.closest('.chip');if(!c)return;c.classList.toggle('on');var v=c.dataset.v,i=S.eq.indexOf(v);if(i<0)S.eq.push(v);else S.eq.splice(i,1)};
$('ph').onchange=function(){var th=$('th');th.innerHTML='';[].forEach.call(this.files,function(f){var im=new Image();im.src=URL.createObjectURL(f);th.appendChild(im)});if(this.files.length)$('note').textContent='사진 '+this.files.length+'장을 받았어요! 아래에서 쓸 수 있는 물건을 골라 주세요.'};
function build(){
 var h=+$('h').value/100,w=+$('wt').value,bmi=(w/(h*h)),lv=+$('lvl').value,min=+$('min').value,n=min<=10?4:min<=15?5:6;
 var pool=EX.filter(function(x){return x.q==='none'||S.eq.indexOf(x.q)>=0});
 if(S.body==='chubby')pool=pool.filter(function(x){return !x.hi});
 pool.sort(function(a,b){
  var sa=(a.q!=='none'?2:0)+(S.goal==='diet'&&a.cardio?2:0)+(S.goal==='muscle'&&!a.cardio?1:0)+(S.body==='slim'&&!a.cardio?1:0)+Math.random();
  var sb=(b.q!=='none'?2:0)+(S.goal==='diet'&&b.cardio?2:0)+(S.goal==='muscle'&&!b.cardio?1:0)+(S.body==='slim'&&!b.cardio?1:0)+Math.random();
  return sb-sa});
 S.quests=pool.slice(0,n).map(function(x,i){
  var f=lv===0?.7:lv===2?1.3:1,amt=x.r?Math.max(5,Math.round(x.r*f))+'회 × 3세트':Math.round(x.s*f)+'초 × 3세트';
  return {n:x.n,p:x.p,amt:amt,g:x.g,e:x.e,easy:false,done:false,xp:20}});
 var cat=bmi<18.5?'가벼운 편':bmi<23?'표준 범위':bmi<25?'약간 높은 편':'높은 편';
 $('sum').textContent='오늘의 퀘스트 '+n+'개';
 $('sum2').textContent='BMI '+bmi.toFixed(1)+' ('+cat+') · 목표: '+$('goal').querySelector('.on').textContent+' · 약 '+min+'분. BMI는 참고용이며 진단이 아니에요.';
 places();render();go(3)}
function render(){
 var d=S.quests.filter(function(q){return q.done}).length,box=$('qs');box.innerHTML='';
 S.quests.forEach(function(q,i){
  var c=document.createElement('div');c.className='card q'+(q.done?' done':'');
  c.innerHTML='<input type="checkbox" '+(q.done?'checked disabled':'')+'><div><span class="tag">'+q.p+' · +'+q.xp+'XP</span><b>'+q.n+' — '+q.amt+'</b><span class="sub">'+(q.easy?'쉬운 버전: '+q.e:q.g)+'</span>'+(q.done||q.easy?'':'<br><button class="sm">너무 힘들어요</button>')+'</div>';
  c.querySelector('input').onchange=function(){q.done=true;S.xp+=q.xp;save();toast('퀘스트 클리어! +'+q.xp+'XP');render()};
  var b=c.querySelector('.sm');if(b)b.onclick=function(){q.easy=true;q.xp=15;toast('괜찮아요, 쉬운 버전으로 바꿨어요');render()};
  box.appendChild(c)});
 var all=d===S.quests.length&&d>0;
 $('fin').innerHTML=all?'🎉 오늘 퀘스트 모두 클리어!<br><span class="sub">보너스 +30XP를 받았어요. 내일도 도전해요.</span>':'진행 '+d+' / '+S.quests.length+'<br><span class="sub">의욕이 없는 날엔 하나만 해도 충분해요.</span>';
 if(all&&!S.bonus){S.bonus=true;S.xp+=30;S.streak++;save()}
 head()}
function head(){var l=Math.floor(S.xp/100)+1;$('lv').textContent='Lv.'+l+' · '+S.xp+'XP · 🔥'+S.streak+'일';$('xpb').style.width=(S.xp%100)+'%'}
function places(){
 var s=0;[].forEach.call(document.querySelectorAll('.pq'),function(x){s+=+x.value});
 var t=s<=1?'solo':s>=2?'social':'mix';
 var D={
 solo:{h:'🏋️ 혼자 집중형',d:'눈치 보지 않고 내 페이스로 하는 운동이 잘 맞아요. 헬스 위주로 시작해 보세요.',i:[['헬스장','개인 운동 중심 · 초보자 PT와 무료 체험이 있는지 확인해요','map']]},
 social:{h:'🤝 함께 즐기는 형',d:'같이 하면 더 오래 가는 타입이에요. 복싱이나 러닝크루가 잘 맞아요.',i:[['복싱장','초보 그룹 수업과 체험 수업이 있는지 확인해요','map'],['러닝크루 모집','입문자 환영 · 모집 중인지 게시일을 꼭 확인해요','web']]},
 mix:{h:'⚖️ 상황에 따라 다른 형',d:'혼자 시작해서 익숙해지면 함께 운동해도 좋아요.',i:[['헬스장','개인 운동 중심으로 시작','map'],['러닝크루 모집','입문자 환영 · 모집 중인지 확인','web']]}
 }[t];
 var h='<h2>'+D.h+'</h2><p class="sub">'+D.d+'</p><label>내 동네 (선택)</label><input type="text" id="area" placeholder="예: 부천 중동">';
 D.i.forEach(function(x){h+='<div style="margin:10px 0"><b>'+x[0]+'</b><br><span class="sub">'+x[1]+'</span><br><a class="lk" target="_blank" rel="noopener" data-q="'+x[0]+'" data-m="'+x[2]+'">검색하기 ↗</a></div>'});
 h+='<p class="sub">💸 비용이 부담되면 아래 퀘스트로 집에서 무료로 시작해도 돼요. 나중에 언제든 다시 찾아볼 수 있어요.</p><p class="sub" style="font-size:12px">지금은 일반 검색 링크예요. 실제 제휴 시설과 모집 중인 크루 정보는 확인 후 연결할 예정이에요.</p>';
 var F=[
{n:'샘플 헬스장 A',k:'헬스',t:'solo',b:1,p:'월 5~6만원대',tr:'1일 무료 체험',ad:1,d:'도보 8분'},
{n:'샘플 헬스장 B',k:'헬스',t:'solo',b:0,p:'월 3~4만원대',tr:'일일권 가능',ad:0,d:'도보 15분'},
{n:'샘플 복싱장 C',k:'복싱',t:'social',b:1,p:'월 8~10만원대',tr:'체험 수업 1회',ad:1,d:'버스 10분'},
{n:'샘플 그룹운동 D',k:'크로스핏·필라테스',t:'social',b:1,p:'월 12만원대~',tr:'상담 후 체험',ad:0,d:'도보 12분'}];

   var u=/^https?:\/\//.test(f.url||'')?esc(f.url):'';
